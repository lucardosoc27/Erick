<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pets - VetSAEP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-pagina="pets">
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <nav class="topo">
    <strong class="marca">🐾 VetSAEP</strong>
    <a href="dashboard.html" >Dashboard</a>
    <a href="tutores.html" >Tutores</a>
    <a href="pets.html" class="ativo">Pets</a>
    <a href="agendamentos.html" >Agendamentos</a>
    <span class="espaco"></span>
    <span class="usuario">👤 <span id="usuario-nome"></span></span>
    <button id="btn-sair" class="btn sec pequeno" type="button">Sair</button>
  </nav>
  <main class="conteudo">
    <div class="titulo-pagina"><h2>Pets</h2><button class="btn" id="btn-novo" type="button">+ Novo pet</button></div>
    <div id="area-form"></div>
    <div class="card">
      <form class="busca" id="form-busca">
        <input type="search" name="q" placeholder="Buscar pet por nome" aria-label="Buscar pet por nome">
        <button class="btn sec" type="submit">Buscar</button>
      </form>
      <div class="tabela-wrap"><table>
        <thead><tr><th>Nome</th><th>Espécie</th><th>Raça</th><th>Peso (kg)</th><th>Tutor</th><th></th></tr></thead>
        <tbody id="lista"></tbody>
      </table></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
